# Report design: wheel encoders + IMU give the smooth odom->base frame;
# visual odometry contributes ORIENTATION (yaw) ONLY, as a differential heading correction.
# Config order: x y z | roll pitch yaw | vx vy vz | vroll vpitch vyaw | ax ay az
ekf_filter_node:
  ros__parameters:
    use_sim_time: true
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    predict_to_current_time: true

    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    # Wheel encoders: forward velocity + yaw rate
    odom0: /wheel/odom
    odom0_config: [false, false, false,
                   false, false, false,
                   true,  false, false,
                   false, false, true,
                   false, false, false]
    odom0_queue_size: 20
    odom0_differential: false
    odom0_relative: false

    # IMU: yaw rate
    imu0: /imu/data
    imu0_config: [false, false, false,
                  false, false, false,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_queue_size: 50
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true

    # Visual odometry: YAW ONLY (x, y, z ignored), fused differentially
    odom1: /vo/odom
    odom1_config: [false, false, false,
                   false, false, true,
                   false, false, false,
                   false, false, false,
                   false, false, false]
    odom1_queue_size: 10
    odom1_differential: true
    odom1_relative: false
